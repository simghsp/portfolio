name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — pnpm/action-setup reads it from package.json's
      # `packageManager` field, and specifying both causes ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Type checking runs as part of `next build` (it needs Next's
      # generated ambient types, e.g. LayoutProps, which only exist once the
      # framework has bootstrapped) — a standalone `tsc --noEmit` step fails
      # here for the same reason.
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://portfolio-ashy-eight-i7xe4ihgl4.vercel.app
